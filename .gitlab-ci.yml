# KineticOS: build the image variants, push them to ghcr, then (manually) build
# and publish the installer ISOs.
#
# RUNNER — needs a self-hosted GitLab Runner tagged `kineticos-builder` with the
# shell executor on a Fedora host that has rootful podman, skopeo and
# dcli-bootc, plus passwordless sudo. GitLab.com shared runners cannot build
# bootc images (no privileged/nested containers). Full setup in CI.md.
#
# CI/CD VARIABLES (Settings -> CI/CD -> Variables):
#   GHCR_USER   GitHub username that owns the ghcr package
#   GHCR_TOKEN  GitHub PAT with `write:packages` (masked, protected)
# Omit both if ghcr.io/theblack-don/kineticos is public and you only ever pull.
#
# The runner is a *builder*, not a deployment target: every build uses
# --no-switch and --no-import, so CI never changes the runner's own bootc
# deployment or the project's overlay manifest.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - image
  - iso

variables:
  IMAGE_NAME: kineticos
  IMAGE_REGISTRY: ghcr.io/theblack-don

# Shared settings for the image jobs.
.image_job:
  stage: image
  tags: [kineticos-builder]
  resource_group: kineticos-build
  before_script:
    - |
      if [ -n "${GHCR_TOKEN:-}" ]; then
        echo "$GHCR_TOKEN" | sudo skopeo login "$IMAGE_REGISTRY" -u "$GHCR_USER" --password-stdin
      fi

# Pull the latest base, rebuild the AMD/Intel image, push :default.
image:default:
  extends: .image_job
  script:
    - dcli-bootc update --no-switch --no-import
    - sudo skopeo copy
        "containers-storage:localhost/${IMAGE_NAME}:default"
        "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:default"

# Pull the latest base, rebuild the NVIDIA image, push :nvidia.
image:nvidia:
  extends: .image_job
  script:
    - dcli-bootc update --nvidia --no-switch --no-import
    - sudo skopeo copy
        "containers-storage:localhost/${IMAGE_NAME}:nvidia"
        "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:nvidia"

# Pull the latest base, rebuild the NVIDIA (proprietary driver, older GPUs)
# image, push :nvidia-legacy. The base image comes from hosts/nvidia-legacy.yaml
# because profile.yaml only has two base-image slots. If `update --host` does
# not produce the :nvidia-legacy tag with your dcli-bootc version, use
# `dcli-bootc build --host nvidia-legacy -t nvidia-legacy` instead.
image:nvidia-legacy:
  extends: .image_job
  script:
    - dcli-bootc update --host nvidia-legacy --no-switch --no-import
    - sudo skopeo copy
        "containers-storage:localhost/${IMAGE_NAME}:nvidia-legacy"
        "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:nvidia-legacy"

# Manual: build both installer ISOs and upload them to the project's Generic
# Package Registry, which gives a stable download URL to attach to a Release.
iso:
  stage: iso
  tags: [kineticos-builder]
  resource_group: kineticos-build
  needs: ["image:default", "image:nvidia", "image:nvidia-legacy"]
  when: manual
  script:
    - ./build-iso.sh
    - ./build-iso.sh nvidia
    - ./build-iso.sh nvidia-legacy
    - |
      set -euo pipefail
      VERSION="$(date +%Y%m%d)"
      for f in output/*.iso; do
        name="$(basename "$f")"
        echo "Publishing ${name} (version ${VERSION}) ..."
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${IMAGE_NAME}/${VERSION}/${name}"
      done
      echo
      echo "ISOs available under:"
      echo "  ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${IMAGE_NAME}/${VERSION}/"
