# kineticos: make confirmation prompts default to Yes (shows Y/n instead of y/N)
[main]
defaultyes=True
# BIB's legacy anaconda-iso solver only reads /etc/yum.repos.d, so the system
# module mirrors Fedora 45's vendor repos there. Read only that directory so
# dnf does not load the same repo ID from both locations.
reposdir=/etc/yum.repos.d
