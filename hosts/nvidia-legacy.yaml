# Third image variant: Bazzite's proprietary NVIDIA driver, for GPUs that the
# open kernel modules don't support (older cards).
#
# profile.yaml only has two base-image slots (`base_image` and
# `nvidia_base_image`), and `dcli-bootc` has a `--nvidia` switch for exactly
# one of them. The third variant therefore overrides the base image through a
# host config, selected at build time with:
#
#   dcli-bootc build --host nvidia-legacy -t nvidia-legacy
#
# Keep the tag here in sync with the ISO disk config
# (disk_config/iso-kineticos-nvidia-legacy.toml) and the pushed registry tag.
base_image: ghcr.io/ublue-os/bazzite-nvidia:stable
