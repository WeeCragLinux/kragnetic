description: Brand the image as KineticOS in os-release
scripts:
  post: |
    # bootc-image-builder derives the installer/ISO identity — the ISO boot
    # menu entry and the "… 44" shown in Anaconda — from the image's
    # os-release. /etc/os-release is a symlink to /usr/lib/os-release.
    #
    # Only the display identity is changed. ID, ID_LIKE and VERSION_ID keep
    # their upstream values so dnf $releasever and any Bazzite tooling that
    # keys off ID=bazzite keep working. VARIANT_ID/IMAGE_ID are deliberately
    # left alone because Bazzite uses them to pick GPU-specific config.
    #
    # The kineticos-logo icon is installed from the project's files/ tree
    # (usr/share/pixmaps + hicolor/256x256) by the overlay module.
    . /usr/lib/os-release
    sed -i \
      -e 's/^NAME=.*/NAME="KineticOS"/' \
      -e 's/^PRETTY_NAME=.*/PRETTY_NAME="KineticOS"/' \
      -e 's/^VARIANT=.*/VARIANT="KineticOS"/' \
      -e 's/^VERSION_CODENAME=.*/VERSION_CODENAME="KineticOS"/' \
      -e 's/(Kinoite)/(KineticOS)/' \
      -e 's/^DEFAULT_HOSTNAME=.*/DEFAULT_HOSTNAME="kineticos"/' \
      -e 's/^BOOTLOADER_NAME=.*/BOOTLOADER_NAME="KineticOS"/' \
      -e 's/^LOGO=.*/LOGO=kineticos-logo/' \
      -e 's|^HOME_URL=.*|HOME_URL="https://gitlab.com/theblackdon/kineticos"|' \
      -e 's|^DOCUMENTATION_URL=.*|DOCUMENTATION_URL="https://gitlab.com/theblackdon/kineticos"|' \
      -e 's|^SUPPORT_URL=.*|SUPPORT_URL="https://gitlab.com/theblackdon/kineticos"|' \
      -e 's|^BUG_REPORT_URL=.*|BUG_REPORT_URL="https://gitlab.com/theblackdon/kineticos/-/issues"|' \
      -e "s|^CPE_NAME=.*|CPE_NAME=\"cpe:/o:kineticos:kineticos:${VERSION_ID}\"|" \
      /usr/lib/os-release

    # Drop Bazzite's glow-rendered welcome banner (ujust/brew tips) so fresh
    # shells start clean. ublue-motd reads these on every interactive shell and
    # from fish's fish_greeting.
    : > /usr/share/ublue-os/motd/template.md
    : > /usr/share/ublue-os/motd/template.sv.md
