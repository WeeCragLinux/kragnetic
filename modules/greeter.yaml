description: Noctalia greeter (greetd) - pre-configured
packages:
  - greetd
scripts:
  post: |
    # Pre-configure greetd to run the Noctalia greeter directly (no interactive
    # kineticwe-setup-greeter step needed).
    mkdir -p /etc/greetd
    cat > /etc/greetd/config.toml << 'EOF'
    [terminal]
    vt = 1

    [default_session]
    command = "/usr/bin/noctalia-greeter-session"
    user = "greetd"
    EOF

    # Fedora's greetd package creates the "greetd" session account; make sure it
    # exists and has GPU/input access for the greeter compositor.
    if ! id greetd &>/dev/null; then
      useradd -r -s /usr/sbin/nologin -d /var/lib/noctalia-greeter greetd || true
    fi
    usermod -a -G video,input greetd 2>/dev/null || true

    # greetd.service has no Alias=display-manager.service on Fedora, so create
    # the symlink ourselves or graphical.target never starts the greeter.
    systemctl enable greetd.service
    ln -sf /usr/lib/systemd/system/greetd.service /etc/systemd/system/display-manager.service
    systemctl set-default graphical.target

    # Pin the greeter to KineticWE's default palette (Catppuccin). The declarative
    # greeter.toml wins over the mutable sync.toml, so a stale scheme or a previous
    # pick cannot leave the greeter on a different theme. Seed it through
    # systemd-tmpfiles `C` so /var stays empty in the image and the file appears
    # (owned by greetd) on first boot; `C` only copies when the target is missing,
    # preserving any user edits afterwards.
    install -Dm0644 /dev/stdin /usr/share/kineticos/greeter.toml << 'EOF'
    # Kragnetic: declarative greeter config. Noctalia Sync/UI never write this.
    [appearance]
    scheme = "Catppuccin"
    EOF

    # zz- so this runs after the noctalia-greeter package's `d` entry, which
    # creates /var/lib/noctalia-greeter with the right owner.
    install -Dm0644 /dev/stdin /usr/lib/tmpfiles.d/zz-kineticos-greeter.conf << 'EOF'
    # Kragnetic: seed the Catppuccin greeter default on first boot.
    C /var/lib/noctalia-greeter/greeter.toml 0644 greetd greetd - /usr/share/kineticos/greeter.toml
    EOF
