description: KineticOS Plymouth boot splash (opt-in)
scripts:
  post: |
    # bootc/ostree: files added to the image's /etc are NOT reliably merged
    # into /etc on a rebase (only on a fresh install), because /etc is a
    # mutable 3-way merge. So both the theme selection and the dracut drop-in
    # must live under /usr to be part of the deployment.
    #
    # Theme files come from files/usr/share/plymouth/themes/kineticos, copied
    # by the overlay module which must run before this one.

    # 1. Force the theme + plugin into any initramfs dracut generates
    #    (bootc install, kernel update, `rpm-ostree initramfs`, ...).
    install -d /usr/lib/dracut/dracut.conf.d
    cat > /usr/lib/dracut/dracut.conf.d/kineticos-plymouth.conf <<'DRACUT_CONF'
    install_items+=" /usr/share/plymouth/themes/kineticos/kineticos.plymouth "
    install_items+=" /usr/share/plymouth/themes/kineticos/kineticos.script "
    install_items+=" /usr/share/plymouth/themes/kineticos/logo.png "
    install_items+=" /usr/lib64/plymouth/script.so "
    DRACUT_CONF

    # 2. Select the theme from /usr. plymouth-populate-initrd reads
    #    plymouthd.defaults, and unlike /etc/plymouth/plymouthd.conf this file
    #    is part of the deployment and reaches rebased systems. Set ONLY Theme=
    #    here: plymouth's parser matches both "Theme" and "ThemeDir", so a
    #    ThemeDir line makes it resolve to garbage (and fall back to `text`).
    if [ -f /usr/share/plymouth/plymouthd.defaults ]; then
        sed -i \
            -e '/^ThemeDir=/d' \
            -e 's/^Theme=.*/Theme=kineticos/' \
            /usr/share/plymouth/plymouthd.defaults
    fi

    # 3. Also write the /etc config, which covers fresh installs and local use.
    install -d /etc/plymouth
    cat > /etc/plymouth/plymouthd.conf <<'PLYMOUTH_CONF'
    [Daemon]
    Theme=kineticos
    PLYMOUTH_CONF
