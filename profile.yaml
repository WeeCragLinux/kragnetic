name: kineticos
base_image: ghcr.io/ublue-os/bazzite:stable
nvidia_base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
default_tag: latest
package_manager: dnf

enabled_modules:
  - removals
  - kineticwe
  - session
  - greeter
  - system
  # Terra repo (Fyra Labs). Disabled by default; uncomment to enable. Kept after
  # the modules whose packages already resolve against the base image, so
  # enabling Terra can't shadow them.
  # - terra
  # RPM Fusion free + nonfree repos (repo-only module; keep with the other repo
  # modules, before the overlay).
  # - rpmfusion
  # Persistent /usr overlay + kinpkg (RakuOS-style); must run last, after the
  # files/ tree is copied into the image (installs the dnf shim over Atomic's).
  - overlay

# usr-overlay manifest: packages installed live into the persistent /usr
# overlay, managed by `dcli-bootc overlay import`/`sync`. NOT in enabled_modules
# (its packages belong in the overlay, not the image). The `overlay` module
# above is the infra (mount unit + kinpkg) and stays enabled. Ships empty so
# each user runs `dcli-bootc overlay import` to snapshot their own packages.
overlay_module: overlay-packages
overlay_backend: kinpkg

Services:
  - account-service-manager

flatpak_remotes:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo
