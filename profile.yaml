name: kineticos
base_image: ghcr.io/ublue-os/bazzite:stable
nvidia_base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
default_tag: default
package_manager: dnf

# Bake this project's source into the image at /usr/share/kineticos/project so a
# running system can reproduce or fork the recipe offline via `dcli-bootc init`.
include_project: true

enabled_modules:
  - removals
  - kineticwe
  - session
  - greeter
  - system
  # Terra repo (Fyra Labs). Disabled by default; uncomment to enable. Kept after
  # the modules whose packages already resolve against the base image, so
  # enabling Terra can't shadow them.
  # - terra
  # Persistent /usr overlay + kinpkg (RakuOS-style); must run last, after the
  # files/ tree is copied into the image (installs the dnf shim over Atomic's).
  - overlay

# usr-overlay manifest: packages installed live into the persistent /usr
# overlay. NOT in enabled_modules (its packages belong in the overlay, not the
# image). The `overlay` module above is the infra (mount unit + kinpkg) and
# stays enabled. `build`/`update` snapshot live overlay installs here
# automatically, so a plain `dnf`/`kinpkg` install is recorded with no manual
# `dcli-bootc overlay import` step.
overlay_module: overlay-packages
overlay_backend: kinpkg

Services:
  - account-service-manager

flatpak_remotes:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo
